name: Asset-free RTL diagnostics

on:
  push:
    paths:
      - 'rtl/**'
      - 'verilator/**'
      - 'scripts/prepare_kanji.py'
      - 'scripts/mister_matrix.py'
      - 'scripts/compare_video_png.py'
      - 'scripts/test_mister_matrix.py'
      - '.github/workflows/diagnostics.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'verilator/**'
      - 'scripts/prepare_kanji.py'
      - 'scripts/mister_matrix.py'
      - 'scripts/compare_video_png.py'
      - 'scripts/test_mister_matrix.py'
      - '.github/workflows/diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-diagnostics:
    runs-on: ubuntu-24.04
    # The earlier 52-target job took 41m47s including the pinned tool build.
    # Keep full mixed-pixel/DIP/X3 matrices, per-target limits and assertions;
    # give the expanded job headroom rather than shortening those tests.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang autoconf flex bison help2man libfl-dev zlib1g-dev python3
          g++ --version
          clang++ --version
      - name: Checkout tested simulator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: verilator/verilator
          ref: 8df584ca1ddde5c8afbd15dc5fdcb677a78f9af2 # v5.044
          path: .ci-tools/verilator
          persist-credentials: false
          fetch-depth: 1
      - name: Build pinned Verilator 5.044
        timeout-minutes: 15
        working-directory: .ci-tools/verilator
        run: |
          autoconf
          CXX=clang++ ./configure --prefix="${RUNNER_TEMP}/x1-verilator-5.044"
          make -j2
          make install
          "${RUNNER_TEMP}/x1-verilator-5.044/bin/verilator" --version
          echo "${RUNNER_TEMP}/x1-verilator-5.044/bin" >> "${GITHUB_PATH}"
      - name: Run original standalone and shared-machine fixtures
        run: |
          for target in \
            test-sio-async test-sio-break test-sio-formats test-sio-irq test-sio-first-status \
            test-sio-flow test-sio-cpu test-sio-cpu-irq-reset test-sio-dma test-sio-dma-cpu \
            test-dma test-dma-compare test-dma-search test-dma-cpu test-dma-service test-dma-service-cpu \
            test-dma-native-irq test-dma-native-irq-cpu test-dma-ready-irq test-dma-ready-irq-cpu \
            test-dma-restart-irq test-dma-restart-irq-cpu \
            test-dma-reload-snapshot \
            test-machine-dma-restart-irq test-machine-dma-restart-irq-snapshot test-machine-dma-restart-fdc test-machine-dma-restart-board test-machine-dma-restart-visible \
            test-board-single \
            test-dma-irq-bridge test-machine-dma-irq test-machine-dma-irq-nested test-machine-dma-irq-keyboard test-machine-dma-irq-snapshot \
            test-kanji-conversion test-kanji-address test-kanji-decode test-kanji-rom test-kanji-cg-selector test-kanji-cg-access test-kanji-cg-cpu \
            test-machine-kanji test-machine-kanji-fast test-machine-kanji-snapshot \
            test-machine-kanji-x3 test-machine-kanji-x3-fast test-machine-kanji-x3-snapshot test-machine-kanji-reset \
            test-machine-kanji-loader \
            test-machine-kanji-render test-machine-kanji-render-timing test-machine-kanji-render-snapshot \
            test-machine-kanji-mixed test-machine-kanji-mixed-timing \
            test-turbo-dsw test-machine-turbo-dsw-fast test-machine-turbo-dsw-timing test-turbo-dsw-snapshot \
            test-machine-dma-x3-fast test-machine-dma-x3-timing test-machine-dma-x3-snapshot \
            test-dual-snapshot test-dual-write-snapshot test-video-dump test-continue-native-dual \
            test-dma-reset test-cpu-busreq test-d88-scanner test-d88-crc \
            test-d88-metadata test-fdc-abort test-fdc-sd-abort test-joystick test-rgb12 test-z-palette-ram test-mister-matrix-safety test-fm test-fm-cpu test-probe-timeout; do
            # Bound each original fixture without changing its assertions or
            # simulated duration. A stall must fail with an identifiable target.
            limit_s=180
            # This fixture retains its full 65,537-byte/wrap cases at all CEs;
            # allow its unoptimized build/run extra time, not fewer cycles.
            if [ "${target}" = test-dma ]; then limit_s=600; fi
            # Observed 180-second timeout after passing clock/keyboard/MR16,
            # during the unchanged actual-board-frequency dual-disk matrix.
            if [ "${target}" = test-board-single ]; then limit_s=900; fi
            if [ "${target}" = test-machine-dma-irq ]; then limit_s=300; fi
            if [ "${target}" = test-machine-dma-irq-nested ] || [ "${target}" = test-machine-dma-irq-snapshot ]; then limit_s=300; fi
            if [ "${target}" = test-machine-dma-irq-keyboard ]; then limit_s=300; fi
            if [ "${target}" = test-machine-kanji ] || [ "${target}" = test-machine-kanji-fast ] || [ "${target}" = test-machine-kanji-snapshot ]; then limit_s=300; fi
            case "${target}" in test-machine-kanji-x3*) limit_s=300 ;; esac
            case "${target}" in test-machine-kanji-render*) limit_s=900 ;; esac
            case "${target}" in test-machine-kanji-mixed*) limit_s=900 ;; esac
            if [ "${target}" = test-turbo-dsw-snapshot ]; then limit_s=900; fi
            case "${target}" in test-machine-dma-x3*) limit_s=900 ;; esac
            case "${target}" in test-machine-dma-restart*) limit_s=900 ;; esac
            if [ "${target}" = test-dual-snapshot ]; then limit_s=900; fi
            if [ "${target}" = test-dual-write-snapshot ]; then limit_s=900; fi
            if [ "${target}" = test-video-dump ]; then limit_s=900; fi
            echo "Running ${target} (${limit_s}-second wall-clock limit)"
            # Verilator 5.020 exceeded the DMA compile limit even with Clang
            # at O0. Use the locally qualified pinned 5.044 generator above.
            # Select Clang
            # explicitly: --compiler alone does not select the make compiler.
            # Keep all RTL assertions, delays and full simulated durations.
            timeout "${limit_s}s" make -C verilator "${target}" HEADLESS_DIR=obj_dir_ci \
              V='verilator --compiler clang -CFLAGS -std=c++20 -MAKEFLAGS CXX=clang++' CXX=clang++ DMA_TEST_CFLAGS=-O0 || exit $?
          done
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
